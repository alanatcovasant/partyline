# Lakebase Autoscaling (serverless Postgres) for the Partyline bus.
# Autoscale (postgres_projects) is chosen over provisioned (database_instances) because
# the PRD requires scale-to-zero at idle. The app mints short-lived OAuth credentials
# against the endpoint below (see app/db.py).
#
# NOTE: autoscale Lakebase-as-a-bundle-resource is new; validate against the workspace
# (`databricks bundle validate --profile <p>`) and adjust project_id/branch/endpoint
# naming as the API requires before first deploy.
resources:
  postgres_projects:
    partyline_pg:
      project_id: partyline-${bundle.target}
      display_name: "Partyline coordination store (${bundle.target})"
      pg_version: 17

  postgres_branches:
    partyline_branch:
      branch_id: production
      parent: ${resources.postgres_projects.partyline_pg.name}

  postgres_endpoints:
    partyline_endpoint:
      endpoint_id: primary
      parent: ${resources.postgres_branches.partyline_branch.name}
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      # Serverless scale-to-zero: small floor, modest ceiling for bursty coordination load.
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 2
