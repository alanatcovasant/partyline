# Retention job — prunes old messages from Lakebase Postgres.
# Native Lakehouse Sync preserves history in Delta SCD2 before rows are deleted.
# See PRD §7.10.

resources:
  jobs:
    retention_job:
      name: partyline_retention

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: retention_days
          default: "30"
        - name: endpoint_name
          default: "projects/partyline/branches/production/endpoints/primary"

      tasks:
        - task_key: prune_old_messages
          python_wheel_task:
            package_name: covasant_partyline_jobs
            entry_point: main
            parameters:
              - "--retention-days"
              - "{{job.parameters.retention_days}}"
              - "--endpoint-name"
              - "{{job.parameters.endpoint_name}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
