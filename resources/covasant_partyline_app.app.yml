# The Databricks App for Covasant Partyline (Python FastAPI: MCP + REST + ops SPA).
# Source lives in ../covasant-partyline; the path is relative to this file.
resources:
  apps:
    covasant_partyline:
      name: "covasant-partyline"
      description: "Covasant Partyline — inter-agent coordination line (MCP + Lakebase Postgres)"
      source_code_path: ../covasant-partyline

      # Teammate access: every workspace user can reach the app (bridge/CLI/dashboard).
      # Each teammate still authenticates with their own Databricks OAuth (U2M or SP).
      permissions:
        - group_name: users
          level: CAN_USE

      # Runtime config lives here (not app.yaml) so it can reference ${bundle.target};
      # app.yaml is synced verbatim and is NOT interpolated.
      config:
        command: ["python", "-m", "app"]
        env:
          # Full autoscale Lakebase endpoint resource name. Used to mint OAuth DB
          # credentials and to self-provision the project/branch/endpoint (app/db.py).
          - name: ENDPOINT_NAME
            value: "projects/partyline/branches/production/endpoints/primary"

      # Bind the app to the autoscale Lakebase branch. This provisions the app service
      # principal's Postgres role and auto-injects PGHOST/PGPORT/PGDATABASE/PGUSER/PGSSLMODE.
      resources:
        - name: partyline_db
          postgres:
            branch: projects/partyline/branches/production
            # database_id is hyphenated; the underlying PG dbname (PGDATABASE) is databricks_postgres.
            database: projects/partyline/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
