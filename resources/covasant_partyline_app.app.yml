# The Databricks App for Covasant Partyline (Python FastAPI: MCP + REST + ops SPA).
# Source lives in ../covasant-partyline; the path is relative to this file.
resources:
  apps:
    covasant_partyline:
      name: "covasant-partyline"
      description: "Covasant Partyline — inter-agent coordination line (MCP + Lakebase Postgres)"
      source_code_path: ../covasant-partyline

      # Runtime config lives here (not app.yaml) because ENDPOINT_NAME is per-target and
      # app.yaml is NOT interpolated with ${bundle.target}. This config block IS, so the
      # per-target projects (partyline-dev / partyline-prod) resolve correctly at deploy.
      config:
        command: ["python", "-m", "app"]
        env:
          # Full Lakebase endpoint resource name used to mint OAuth DB credentials
          # (app/db.py). NOT auto-injected — must match the provisioned per-target project.
          - name: ENDPOINT_NAME
            value: "projects/partyline-${bundle.target}/branches/production/endpoints/primary"

      # Bind the app to the Lakebase branch. The project/branch/endpoint are provisioned
      # out-of-band (the autoscale postgres_* bundle resources aren't managed by this CLI
      # version), so we reference them by literal name. Auto-injects PG* connection vars.
      resources:
        - name: partyline_db
          postgres:
            branch: projects/partyline-${bundle.target}/branches/production
            database: projects/partyline-${bundle.target}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
