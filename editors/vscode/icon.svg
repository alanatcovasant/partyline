<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#1a1a2e"/>
  <!-- Center hub (the shared coordination line) -->
  <circle cx="64" cy="64" r="12" fill="#00BFA5"/>
  <!-- Broadcast rings (awareness radiating outward) -->
  <circle cx="64" cy="64" r="24" stroke="#00897B" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="64" cy="64" r="38" stroke="#4DB6AC" stroke-width="2.5" fill="none" opacity="0.5"/>
  <circle cx="64" cy="64" r="50" stroke="#80CBC4" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Agent nodes (four agents on the line) -->
  <circle cx="32" cy="32" r="8" fill="#FF6B6B"/>
  <circle cx="96" cy="32" r="8" fill="#4ECDC4"/>
  <circle cx="32" cy="96" r="8" fill="#FFE66D"/>
  <circle cx="96" cy="96" r="8" fill="#A78BFA"/>
  <!-- Connection lines to center hub -->
  <line x1="38" y1="38" x2="56" y2="56" stroke="#FF6B6B" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="38" x2="72" y2="56" stroke="#4ECDC4" stroke-width="2" opacity="0.6"/>
  <line x1="38" y1="90" x2="56" y2="72" stroke="#FFE66D" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="90" x2="72" y2="72" stroke="#A78BFA" stroke-width="2" opacity="0.6"/>
</svg>
