[project]
name = "covasant-partyline"
version = "0.1.0"
description = "Client for the Covasant Partyline coordination bus: local MCP bridge + CLI"
requires-python = ">=3.10"
# The CLI is stdlib-only; the bridge needs mcp + databricks-sdk.
dependencies = [
    "mcp>=1.9",
    "databricks-sdk>=0.81.0",
]

[project.scripts]
partyline = "covasant_partyline.cli:main"
partyline-bridge = "covasant_partyline.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["covasant_partyline"]
