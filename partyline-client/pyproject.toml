[project]
name = "covasant-partyline"
version = "0.1.19"
description = "Client for the Covasant Partyline coordination bus: local MCP bridge + CLI"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# The CLI is stdlib-only; the bridge needs mcp + databricks-sdk.
dependencies = [
    "mcp>=1.9,<2",
    "databricks-sdk>=0.81.0",
]

[project.scripts]
partyline = "covasant_partyline.cli:main"
partyline-bridge = "covasant_partyline.bridge:main"
partyline-channel = "covasant_partyline.channel:main"
codex-pl = "covasant_partyline.codex_runner:launch"
grok-pl = "covasant_partyline.harness_runner:launch_grok"
agy-pl = "covasant_partyline.harness_runner:launch_agy"
kimi-pl = "covasant_partyline.harness_runner:launch_kimi"
cmdc-pl = "covasant_partyline.harness_runner:launch_cmdc"
cursor-agent-pl = "covasant_partyline.harness_runner:launch_cursor"
devin-pl = "covasant_partyline.harness_runner:launch_devin"
omni-pl = "covasant_partyline.omni_runner:launch"
partyline-teams = "covasant_partyline.teams_mirror:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["covasant_partyline"]
