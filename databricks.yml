# This is a Databricks asset bundle definition for covasant_partyline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: covasant_partyline
  uuid: dbb28115-4475-4f98-bf3d-9a6ab65c2ac3

include:
  - resources/*.yml

# node_modules/.venv are already skipped via .gitignore. The built ops SPA is
# gitignored too (build artifact) but IS needed at runtime, so force-sync it.
sync:
  include:
    - "covasant-partyline/client/dist/**"

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405607474919121.1.azuredatabricks.net
    variables:
      catalog: covasant
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405613581513114.14.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/alan.dennis@covasant.com to make sure we only have a single copy.
      root_path: /Workspace/Users/alan.dennis@covasant.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: covasant
      schema: prod
    permissions:
      - user_name: alan.dennis@covasant.com
        level: CAN_MANAGE
