[project]
name = "covasant_partyline_jobs"
version = "0.0.1"
authors = [{ name = "alan.dennis@covasant.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "databricks-sdk>=0.81.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "psycopg[binary]>=3.2",
    "fastapi",
    "uvicorn",
    "mcp>=1.9",
    "pydantic>=2.0",
    "databricks-sdk>=0.81.0",
]

[project.scripts]
main = "covasant_partyline_jobs.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
