<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="#1a1a2e" stroke="#00897B" stroke-width="1.5"/>
  <!-- Center dot (the shared line) -->
  <circle cx="16" cy="16" r="3" fill="#00BFA5"/>
  <!-- Broadcast arcs (party line radiation) -->
  <path d="M10 16 A6 6 0 0 1 16 10" stroke="#00897B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M22 16 A6 6 0 0 1 16 22" stroke="#00897B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M7 16 A9 9 0 0 1 16 7" stroke="#4DB6AC" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M25 16 A9 9 0 0 1 16 25" stroke="#4DB6AC" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Connection nodes (agents on the line) -->
  <circle cx="9" cy="9" r="2" fill="#FF6B6B"/>
  <circle cx="23" cy="9" r="2" fill="#4ECDC4"/>
  <circle cx="9" cy="23" r="2" fill="#FFE66D"/>
  <circle cx="23" cy="23" r="2" fill="#A78BFA"/>
  <!-- Lines connecting nodes to center -->
  <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="#FF6B6B" stroke-width="0.8" opacity="0.5"/>
  <line x1="21.5" y1="10.5" x2="18" y2="14" stroke="#4ECDC4" stroke-width="0.8" opacity="0.5"/>
  <line x1="10.5" y1="21.5" x2="14" y2="18" stroke="#FFE66D" stroke-width="0.8" opacity="0.5"/>
  <line x1="21.5" y1="21.5" x2="18" y2="18" stroke="#A78BFA" stroke-width="0.8" opacity="0.5"/>
</svg>
